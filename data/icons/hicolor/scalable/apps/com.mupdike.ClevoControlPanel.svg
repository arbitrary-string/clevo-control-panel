<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#362a5c"/>
      <stop offset="1" stop-color="#141b2e"/>
    </linearGradient>
    <linearGradient id="keyGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b6a"/>
      <stop offset="0.33" stop-color="#ffd166"/>
      <stop offset="0.66" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <rect x="22" y="44" width="84" height="48" rx="11" fill="#212a3d" stroke="#0c111c" stroke-width="2"/>

  <rect x="29" y="79" width="70" height="6" rx="3" fill="url(#keyGlow)" opacity="0.5" filter="url(#glow)"/>

  <g filter="url(#glow)">
    <rect x="30" y="53" width="13" height="13" rx="3.5" fill="#ff5b6a"/>
    <rect x="47.5" y="53" width="13" height="13" rx="3.5" fill="#ffd166"/>
    <rect x="65" y="53" width="13" height="13" rx="3.5" fill="#3ddc84"/>
    <rect x="82.5" y="53" width="13" height="13" rx="3.5" fill="#5b8cff"/>
  </g>

  <rect x="30" y="70" width="65" height="7" rx="3.5" fill="#39445c"/>
</svg>
